[module]
name = "essentials"
description = "常用 CLI 工具"
groups = ["base"]
order = 10
content = ["htop", "tree", "curl", "jq"]

[debian]
install = [
  "sudo apt-get update -qq",
  "sudo apt-get install -y htop tree curl jq",
  "htop --version | head -1",
  "jq --version",
  "tree --version | head -1",
  "curl --version | head -1",
]

[fedora]
install = [
  # 四包 Fedora 档案库直收 (htop/tree/curl/jq 同名, repoquery fc44 已核实), 无需厂商源;
  # dnf 元数据按需自动刷新, 无 apt-get update 的等价步骤
  "sudo dnf install -y htop tree curl jq",
  "htop --version | head -1",
  "jq --version",
  "tree --version | head -1",
  "curl --version | head -1",
]
