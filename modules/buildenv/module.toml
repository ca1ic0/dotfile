[module]
name = "buildenv"
description = "编译工具链 (gcc/llvm/clang/cmake/ninja)"
groups = ["dev"]
order = 12
requires = []
content = ["build-essential (gcc/g++/make)", "llvm + clang", "cmake", "ninja"]

[debian]
install = [
  "sudo apt-get install -y build-essential gcc llvm clang make cmake ninja-build",
  "gcc --version | head -1",
  "clang --version | head -1",
  "cmake --version | head -1",
  "ninja --version",
]
