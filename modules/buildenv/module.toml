[module]
name = "buildenv"
description = "编译工具链 (gcc/llvm/clang/cmake/ninja)"
groups = ["dev"]
order = 12
requires = []
content = ["build-essential (gcc/g++/make)", "llvm + clang", "cmake", "ninja"]

[debian]
install = [
  "sudo apt-get install -y build-essential llvm clang cmake ninja-build",
  "gcc --version | head -1",
  "clang --version | head -1",
  "cmake --version | head -1",
  "ninja --version",
]

[fedora]
install = [
  # build-essential 是 Debian 系元包, Fedora 无此包: 直列 gcc/gcc-c++/make
  # (不用 @development-tools — 整组远超 gcc/g++/make 语义所需)。
  # 七包全在 Fedora 44 档案库 (repoquery 核实), dnf 直装, 无厂商源;
  # ninja-build 同时装出 /usr/bin/ninja 与 /usr/bin/ninja-build (repoquery --list 核实),
  # clang/llvm 二进制名与 Debian 一致, 验证行照搬 debian 段
  "sudo dnf install -y gcc gcc-c++ make llvm clang cmake ninja-build",
  "gcc --version | head -1",
  "clang --version | head -1",
  "cmake --version | head -1",
  "ninja --version",
]
