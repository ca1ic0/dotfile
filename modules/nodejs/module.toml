[module]
name = "nodejs"
description = "Node.js 环境 (nvm + 最新版 node/npm)"
groups = ["dev"]
order = 14
requires = []
content = ["nvm (~/.nvm, 官方安装器)", "最新版 node + npm (nvm install node)"]

[ubuntu]
# libatomic1: node 官方二进制实测链接 libatomic.so.1 (ldd 实证), 缺它起不来;
# ubuntu 24.04/26.04 档案库均提供该包。
install = [
  "sudo apt-get install -y curl ca-certificates libatomic1",
  "./scripts/install-nvm.sh",
]

["debian@12"]
install = [
  "sudo apt-get install -y curl ca-certificates libatomic1",
  "./scripts/install-nvm.sh",
]

["debian@13"]
# trixie 已无 libatomic1 (GCC14 运行时合并, 容器实证 apt-cache 无候选),
# 且新 glibc 下 node 官方二进制不再依赖它; curl/ca-certificates 直装。
install = [
  "sudo apt-get install -y curl ca-certificates",
  "./scripts/install-nvm.sh",
]

[fedora]
# 同 [ubuntu] 段语义: 三前置包 (repoquery fc44 核实)。libatomic1 在 Fedora
# 叫 libatomic, 且并非徒劳对齐 — node 官方二进制实测链接 libatomic.so.1。
# 安装与验证都在 scripts/install-nvm.sh 内置, 与发行版无关。
install = [
  "sudo dnf install -y curl ca-certificates libatomic",
  "./scripts/install-nvm.sh",
]
