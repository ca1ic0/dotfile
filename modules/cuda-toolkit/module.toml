[module]
name = "cuda-toolkit"
description = "NVIDIA CUDA Toolkit (Ubuntu/Debian 档案库优先; Fedora 与 Debian13 走 NVIDIA 官方源临时注册)"
groups = ["gpu"]
order = 40
requires = ["base"]
content = ["cuda-toolkit 元包 (26.04 档案库 / fedora / debian13, NVIDIA 官方渠道)", "nvidia-cuda-toolkit (24.04 / debian12 档案库)", "nvcc + 开发库 + 工具, 不含 GPU 驱动"]

["ubuntu@26.04"]
install = [
  "sudo apt-get install -y cuda-toolkit",
  "/usr/local/cuda/bin/nvcc --version | tail -2",
]

["debian@13"]
# trixie 档案库无 nvidia-cuda-toolkit (容器实证 Candidate: none), 走 NVIDIA 官方
# debian13 仓: cuda-toolkit 元包依赖闭大多在仓内, 本地 .deb 解不开, 属规范
# 「依赖闭过大可退回仓库形式」例外 — 临时注册安装后退场, 见脚本头注释。
install = [
  "sudo apt-get install -y curl ca-certificates",
  "./scripts/install-cuda-nvidia-repo.sh",
]

[debian]
# debian12 / ubuntu24.04 档案库收录 nvidia-cuda-toolkit (12.x), 系统包直装。
install = [
  "sudo apt-get install -y nvidia-cuda-toolkit",
  "nvcc --version | tail -2",
]

[fedora]
# Fedora 44 档案库不收录 CUDA (repoquery 无), NVIDIA 官方 fedora44 源一次性安装:
# --repofrompath 临时仓库, 不落 /etc/yum.repos.d、不留长期注册。GPG 不用
# --nogpgcheck, 先 rpmkeys --import 把 NVIDIA 公钥落 rpm keyring。
install = [
  "sudo rpmkeys --import https://developer.download.nvidia.com/compute/cuda/repos/fedora44/x86_64/73CD9B30.pub",
  "sudo dnf install -y --repofrompath cuda-fedora44,https://developer.download.nvidia.com/compute/cuda/repos/fedora44/x86_64 cuda-toolkit",
  "/usr/local/cuda/bin/nvcc --version | tail -2",
]
