[module]
name = "agentharness"
description = "Agent CLI 全家桶 (npm 全局安装; hermes 走官方安装器收在 ~/.agentharness)"
groups = ["agentharness"]
order = 46
requires = ["nodejs", "git"]
# 注: zcode-cli 的 npm 包为社区维护 (v0.0.1, 官方站点仅发布桌面端), 官方性存疑但可用
content = ["claude (@anthropic-ai/claude-code)", "pi (@earendil-works/pi-coding-agent)", "mcode (@minimax-ai/code)", "zcode-cli", "opencode (opencode-ai)", "hermes (官方安装器, HERMES_HOME=~/.agentharness/hermes)"]

[debian]
# 选型 upstream first: 五个 CLI 均为官方 npm 包, 默认全局安装到 nvm 的 node bin
# (单一路径, 升级卸载随 npm); pi 按上游 npm 用法单独 --ignore-scripts (其
# postinstall 会另行做托管安装, 且避免影响 opencode 的 postinstall 二进制下载)。
install = [
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && npm install -g @anthropic-ai/claude-code @minimax-ai/code zcode-cli opencode-ai",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && npm install -g --ignore-scripts @earendil-works/pi-coding-agent",
  "sudo apt-get install -y curl ca-certificates && curl -fsSL https://hermes-agent.nousresearch.com/install.sh | HERMES_HOME=$HOME/.agentharness/hermes bash",
  "mkdir -p $HOME/.agentharness/hermes/bin && mv $HOME/.local/bin/hermes $HOME/.agentharness/hermes/bin/hermes",
  "$HOME/.agentharness/hermes/bin/hermes pm repair",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && claude --version | head -1",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && pi --version | head -1",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && mcode --version | head -1",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && zcode-cli --version | head -1",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && opencode --version | head -1",
  "$HOME/.agentharness/hermes/bin/hermes --version | head -1",
]
