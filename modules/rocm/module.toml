[module]
name = "rocm"
description = "AMD ROCm (各目标档案库官方包; 26.04 为 rocm 7.1 元包, 其余为 hipcc/rocminfo 组件)"
groups = ["gpu"]
order = 42
requires = []
content = ["rocm 元包 (26.04: 7.1)", "hipcc + HIP 头文件/运行时 / rocminfo / rocm-smi"]

["ubuntu@26.04"]
install = [
  "sudo apt-get install -y --no-install-recommends rocm",
  "hipcc --version | head -3",
]

[debian]
install = [
  "sudo apt-get install -y --no-install-recommends hipcc rocminfo rocm-smi",
  "hipcc --version | head -3",
]

[fedora]
# Fedora 档案库官方直收 (repoquery fc44 核实, 与 ubuntu@26.04 的 rocm 7.1 同版本族),
# 无需厂商源。注意 Fedora 的包切分比 Debian 细: 只装 hipcc 会缺头文件
# (hip/hip_runtime.h 由 rocm-hip-devel 提供) 与版本信息 (/usr/share/hip/version
# 由 rocm-hip 提供) — 实测 hipcc 编译直接失败, 必须补齐这两个包 (dnf provides 实证)。
# rocm-smi/rocminfo 无 GPU 报错属预期; 验证改为 hipcc 真实编译一个含 hip_runtime.h
# 的源文件, 覆盖 头文件+版本+编译器 全链路。
# 要完整 ROCm 栈可另装元包 rocm (7.1.0, 同 ubuntu@26.04 分支)。
install = [
  "sudo dnf install -y hipcc rocm-hip rocm-hip-devel rocminfo rocm-smi",
  "hipcc --version | head -3",
  "printf '#include <hip/hip_runtime.h>\\nint main(){return 0;}\\n' > /tmp/rocm-check.hip && hipcc /tmp/rocm-check.hip -o /tmp/rocm-check && rm -f /tmp/rocm-check /tmp/rocm-check.hip",
]
