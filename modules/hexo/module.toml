[module]
name = "hexo"
description = "Hexo 静态博客框架 (hexo-cli)"
groups = ["dev"]
order = 35
requires = ["nodejs"]
content = ["hexo-cli (npm -g, 经 nvm 的 node)"]

# hexo-cli 是纯 npm 包 (Fedora 档案库亦未收录), 直接内联 npm 命令, 无需安装脚本;
# node/npm 由 nodejs 模块经 nvm 提供, 非交互 shell 需先加载 nvm。
[debian]
install = [
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && npm install -g hexo-cli",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && hexo version | head -3",
]

[fedora]
install = [
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && npm install -g hexo-cli",
  ". $HOME/.nvm/nvm.sh && nvm use --silent default && hexo version | head -3",
]
