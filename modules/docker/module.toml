[module]
name = "docker"
description = "Docker Engine (官方 apt 源)"
groups = ["dev"]
order = 25
requires = []
content = ["docker-ce", "docker-ce-cli", "containerd.io", "docker-buildx-plugin", "docker-compose-plugin"]

[debian]                     # ubuntu@26.04 经 family 回落命中 [debian]
install = [
  "sudo apt-get install -y curl ca-certificates gnupg",
  "./scripts/setup-docker-repo.sh",
  "sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin",
]
